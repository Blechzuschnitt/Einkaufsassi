    <div class="sbar">
      <label class="btn" for="pick"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg> Foto</label>

    </div>
  </div>

  <nav class="tabs" id="tabs" aria-label="Navigation"></nav>
